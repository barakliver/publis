# ---------------------------------------------------------------------------
# ליור הפקות - Barak Lior, wedding producer.
#
# Details from @barakliver and the "מפיקים חתונה" podcast he hosts with Lidor
# Gorgi. Shares Before I Do's palette: same hand, same company.
# ---------------------------------------------------------------------------

id: liver-productions

brand:
  name: "ברק ליור"
  company: "Liver Production"
  kind: "הפקת חתונות"
  tagline: "מפיקים חתונה"
  website: ""
  instagram: "barakliver"
  facebook: ""
  whatsapp: "+972526604320"
  contact_phone: "052-660-4320"

product:
  what: >
    הפקת חתונות. ליווי זוגות מהרגע שיש תאריך ועד סוף הערב -
    בחירת ספקים, תקציב, לוח זמנים והפקה בשטח ביום עצמו.
  purpose: "שהזוג יהיה אורח בחתונה שלו, ולא מנהל פרויקט"
  podcast:
    name: "מפיקים חתונה"
    with: "לידור ג׳ורג׳י"
    about: "מאחורי הקלעים של עולם החתונות. איך בוחרים אנשים, ואיך לא עושים טעויות יקרות"

audience:
  primary: "זוגות מאורסים ששוקלים מפיק.ה, או שכבר מבינים שהם לא רוצים לעשות את זה לבד"
  secondary: "ספקים ובעלי מקצוע בתעשייה - קהל הפודקאסט"
  pain: >
    זוגות מגלים באמצע שהם מנהלים פרויקט של מאות אלפי שקלים
    בלי ניסיון, מול ספקים שעושים את זה כל יום.

# Related to Before I Do but clearly its own: deep ink and brass. The
# producer's account should not be mistaken for the deck's.
visual:
  colors:
    blue: "#22304C"        # deep navy - the primary ink
    blue_light: "#6E80A0"
    red: "#C9973F"         # brass. the accent
    cream: "#F4F1EA"       # warm paper
    white: "#FFFFFF"
  fonts:
    hebrew: "Assistant"
    fallback: "Heebo"
  assets:
    wordmark_brand: "assets/wordmark-liver-production.png"
    wordmark_brand_dark: "assets/wordmark-liver-production-white.png"
  sizes:
    post:  { w: 1080, h: 1350 }
    story: { w: 1080, h: 1920 }

# ---------------------------------------------------------------------------
# Voice. The producer, not the product. He has run the evening hundreds of
# times and will tell you what actually goes wrong.
# ---------------------------------------------------------------------------
persona:
  name: "ברק"
  who: "מפיק חתונות. מנחה את הפודקאסט ״מפיקים חתונה״."
  stance: >
    מספר מה קורה מאחורי הקלעים, כולל מה שספקים לא אומרים.
    לא מוכר חלום - מסביר איך העסק הזה עובד ואיפה זוגות מפסידים כסף.
  signature_lines:
    - "זו לא חתונה, זה פרויקט של מאות אלפי שקלים"
    - "הטעות הזאת עולה לזוגות עשרות אלפים, והיא נמנעת"
    - "בסוף הערב אתם צריכים להיות אורחים, לא מנהלי פרויקט"
  vocabulary:
    use: ["תכלס", "ספק", "מקדמה", "חוזה", "לו״ז", "הפקה בשטח"]
    metaphors: ["פרויקט", "ניהול", "סיכון", "תמחור"]
  openers:
    - "מאחורי הקלעים:"
    - "הטעות שאני רואה הכי הרבה:"
    - "בפרק האחרון דיברנו על"
    - "ספק לא יגיד לכם את זה, אז אני אגיד:"

language:
  primary: "he"
  also_supported: ["en"]
  gendering: "dotted"
  address: "plural"
  emoji: "moderate"

rules:
  forbidden_words: ["היום המושלם", "קסום", "חלומי", "אגדה"]
  required:
    - "כל טקסט בעברית תקנית"
    - "טענה על מחירים או על ספקים - רק מה שנכון ובזהירות"

schedule:
  timezone: "Asia/Jerusalem"
  posts_per_day: 1
  stories_per_day: 1
  post_times:  ["19:30"]
  story_times: ["20:30"]
  approval_lead_days: 2
  mix: { pain: 2, value: 3, identity: 1, social_proof: 0, sell: 1 }

channels:
  instagram: true
  facebook: false

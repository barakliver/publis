# ---------------------------------------------------------------------------
# לחם - מאפים בעבודת יד
#
# Details taken from lehem.co and @lehem.bakery. The palette is a proposal:
# an artisan sourdough bakery needs crust and grain, not the wedding blue.
# Replace it, and drop a logo into assets/, once the real brand files exist.
# ---------------------------------------------------------------------------

id: lehem

brand:
  name: "לחם"
  company: ""
  kind: "מאפייה · קונדיטוריה · בית קפה"
  tagline: "לחמים ומאפים בעבודת יד"
  website: "https://www.lehem.co"
  instagram: "lehem.bakery"
  facebook: ""
  whatsapp: ""
  contact_phone: "03-5335503"
  address: "האתרוג 25, מתחם הולמס פלייס, גבעת שמואל"

product:
  what: >
    לחמי מחמצת, מאפים מתוקים ומלוחים, עוגות ועוגיות, בית קפה ומגשי אירוח.
    קמחים מגרמניה, דגנים מלאים ודבש. בלי חומרים משמרים, בלי משפרי אפייה,
    בלי סוכר בלחמים.
  purpose: "לחם אמיתי בעבודת יד, כל יום, במקום תעשייתי"
  # The rota. Which loaf comes out on which day - this is what makes
  # anticipation possible at all, so content checks it rather than guessing.
  bake_days:
    "בבילה":                  { what: "עגבניות מיובשות וזיתי קלמטה", days: ["שני", "רביעי", "שישי"] }
    "חיטה מלאה וזיתי קלמטה":  { what: "חיטה מלאה, זיתי קלמטה",       days: ["ראשון", "שלישי", "חמישי", "שישי"] }
    "כוסמין מלא":             { what: "חלק, בלי תוספות",            days: ["שני", "רביעי", "שישי"] }
    "כוסמין מלא ואגוזים":     { what: "כוסמין מלא, אגוזים",          days: ["ראשון", "שלישי", "חמישי", "שישי"] }

  pastries: ["פאן סוויס", "מריטוצו", "בריוש", "סינבון"]

  kitchen:
    - "ארוחות בוקר עם הריבה של סבא וגרנולה שאנחנו מכינים במקום"
    - "השקשוקה של סבא"
    - "פסטות טריות, במקום או הביתה, עם הרטבים שלנו"

  lines:
    breads: ["לבן איטלקי", "כפרי", "שיפון", "בריאות", "קל", "כוסמין", "חיטה מלאה", "רב דגנים"]
    pastry: ["מאפים מתוקים", "מאפים מלוחים", "עוגות", "עוגיות", "בנטו קייק", "ללא סוכר", "טבעוני"]
    cafe:   ["סלטים", "פסטות", "כריכים", "קפה"]
    trays:  ["מגש כריכים", "מגש ירקות", "מגש מתוק", "מגש מלוח"]
  kosher: "כשר בהשגחת רבנות גבעת שמואל"
  hours: "א׳-ה׳ 7:00-19:00 · ו׳ וערבי חג 7:00 עד שעתיים לפני כניסת השבת"
  trays_notice: "מגשי אירוח בהזמנה 48 שעות מראש, באיסוף עצמי"
  years: 11

audience:
  primary: "תושבי גבעת שמואל והסביבה שקונים לחם ומאפים ביומיום"
  secondary: "מזמיני מגשי אירוח - משפחות לאירועים וחברות לישיבות"
  pain: >
    לחם תעשייתי מהסופר נראה זול עד שקוראים מה יש בו.
    ומי שכן רוצה אמיתי לא תמיד יודע איפה זה נאפה ובאיזו שעה.

# ---------------------------------------------------------------------------
# Visual identity. PROPOSED, not supplied - swap for the real palette.
# Crust, sourdough crumb and a warm oven red, so the feed reads as a bakery.
# ---------------------------------------------------------------------------
visual:
  # Measured off the supplied logo artwork, not proposed. The earlier palette
  # here was my invention and is gone - rule 4: where a palette was proposed
  # rather than supplied, replace it, do not defend it.
  colors:
    blue: "#3A322A"        # the dark ground. the logo sits on #242424 charcoal;
                           # warmed slightly toward the chocolate brown asked for
    blue_light: "#8A7656"
    red: "#C09C60"         # wheat gold - the brush outline of the logo
    cream: "#F5EDE2"       # warm off-white, from the wordmark's own #F0E4E4
    white: "#FFFFFF"
    seed: "#90C06C"        # the green seeds. a true accent - tiny, never a ground

  fonts:
    hebrew: "Assistant"
    fallback: "Heebo"

  # This mark is 2.9:1 - tall for its width. At the default 60% it reaches
  # straight up through the engagement marks.
  wordmark_width: "24%"

  assets:
    # Cut from the two supplied PDFs to transparent PNGs. The mono version
    # rides light grounds, the colour one rides dark.
    wordmark_brand: "assets/wordmark-lehem.png"
    wordmark_brand_dark: "assets/wordmark-lehem-dark.png"

  sizes:
    post:  { w: 1080, h: 1350 }
    story: { w: 1080, h: 1920 }

# ---------------------------------------------------------------------------
# Voice. This is the client's own brief, supplied verbatim and turned into
# config. It replaces the four "devices" I had invented, which she rejected.
# Change it only on her say-so.
# ---------------------------------------------------------------------------
persona:
  role: >
    מנהל סושיאל וקופירייטר מקצועי שכותב לאינסטגרם של מאפיית בוטיק
    "לחם - מאפים בעבודת יד", האתרוג 25, גבעת שמואל.

  goal: >
    לייצר חיבור אנושי, להעביר תחושה של ריח וטעם, ולגרום לעוקבים להרגיש את
    האווירה במקום. הכל בצורה אסתטית וללא שיווק אגרסיבי.

  # Three generations working together. Named people, because they are the
  # brand - not a persona I invented.
  family:
    - who: "רן"
      role: "האבא. הקים ומנהל את המקום."
    - who: "סבא"
      role: "בן 85. אופה את הפוקצ'ות מאחורי הקלעים, ומכין את השקשוקה ואת הריבה המפורסמת שלו."
    - who: "סבתא"
      role: "אחראית על האריזות ועל הושבת הלקוחות, עם חיוך."
    - who: "דני"
      role: "הבת. שף-קונדיטורית, הביאה טכניקות מוקפדות מהסטאז' שלה בצרפת."

  pillars:
    - id: "authenticity"
      name: "אותנטיות ומינימליזם"
      what: >
        שפה נקייה, קצרה, ישירה ובגובה העיניים. נותנים לאיכות, לתמונות
        ולסרטונים לדבר בעד עצמם.
    - id: "craft"
      name: "תהליך, קראפט וסבלנות"
      what: >
        לחמי המחמצת (כוסמין, חיטה מלאה, שיפון) מבוססים על קמח, מים והרבה זמן -
        התפחה איטית, בלי סוכר ובלי חומרים משמרים. המאפים המדופדפים (פאן סוויס,
        קרואסונים, סינבון ארטיזנלי) נעשים מאפס בעבודת יד בכל בוקר: קיפולי חמאה
        מדויקים, שכבות, קראנצ'יות.
    - id: "sensory"
      name: "כתיבה חושית"
      what: >
        הטקסט משלים את התמונה. הקראנץ' של הביס הראשון, צליל החיתוך של קרום
        הלחם, האדים שעולים מהתנור, האווירה הרגועה והירוקה בחלל הישיבה.
    - id: "community"
      name: "קהילה"
      what: >
        לא רק מאפייה - מקום לעצור בו רגע, לשתות קפה מעולה ולקחת נשימה לפני
        או במהלך היום.

  formats:
    feed:
      length: "2-4 משפטים"
      shape: >
        משפט פתיחה חזק שמתחבר לוויזואליה, תוכן שמעביר ערך (תהליך או אווירה),
        וסגירה קבועה.
      closing: "האתרוג 25, גבעת שמואל"
      emoji: "1 עד 3 עדינים לכל היותר"
      note: "בלי חפירות"
    story:
      length: "1-4 מילים"
      shape: >
        טקסט מינימליסטי על תמונה או סרטון עשייה. מראה את הלכלוך של הקמח,
        הפתיחה של הבצק, והאנושיות.
      examples: ["קיפולי בוקר", "רק קמח מים וזמן", "התנור הראשון בחוץ"]

  allowed_emoji: ["🌾", "🥐", "☕", "🌿"]

  # The structure for a story sequence, as the client specified it.
  story_sequence:
    length: "3-5 שקפים"
    frames:
      - n: 1
        name: "הוק"
        what: "משפט קצר ומסקרן על תמונה או וידאו חזקים. המטרה: לעצור את הדילוג."
      - n: 2
        name: "הסיפור / התהליך"
        what: "הצצה מאחורי הקלעים - סבא מערבב את הריבה, בועות המחמצת, פתיחת בצק הפסטה."
      - n: 3
        name: "קלוז-אפ / הערך"
        what: "המוצר המוגמר. הביס עצמו, או היתרון הבריאותי והטעמי."
      - n: 4
        name: "קריאה לפעולה"
        what: "משפט שמניע לפעולה - תייגו, שלחו, הזמינו מראש."

  goals:
    - "תיאבון: שפה חושית. הקראנץ' של הקרום, ריח המחמצת בבוקר, הרוטב של הפסטה."
    - "קהילתיות: המשפחתיות. סבא וסבתא. שהעוקבים ירגישו בבית."
    - "ציפייה ו-FOMO: סביב ימי האפייה. ״היום יום שני, זה אומר שהבבילה חזר״."

  host_note: >
    חם, מזמין ואותנטי - לדבר כמו מארח שמקבל חברים לסלון שלו.
    קצר וקולע: קוראים סטוריז תוך כדי רפרוף. משפטים קצרים, פאנצ'יים, עם רווחים.

language:
  primary: "he"
  also_supported: ["en"]
  gendering: "dotted"
  address: "plural"
  emoji: "moderate"

rules:
  # Every one of these is a phrase a bakery reaches for when it has nothing
  # specific to say. That is exactly why they are banned: the ban forces the
  # specific thing out. `node test/voice.test.js` enforces this.
  # Her examples of what never to write, plus the phrases a bakery reaches for
  # when it has nothing specific to say. The ban forces the specific thing out.
  forbidden_words:
    - "הכי טעים בארץ"
    - "מבצע מטורף"
    - "רוצו לקנות"
    - "נאפה באהבה"
    - "באהבה"
    - "כמו של סבתא"
    - "הסוד שלנו"
    - "חוויה קולינרית"
    - "פינוק"
    - "מפנק"
    - "טעים ברמות"
    - "הכי טעים בעיר"
    - "מוזמנים לטעום"
    - "רק אצלנו"
    - "מסורת של דורות"
    - "קסם"
    - "גורמה"
    - "מושלם"
    - "קסום"
  # Everything outside her four. Anything louder than 🌾 🥐 ☕ 🌿 is out.
  banned_emoji: ["🚀", "⭐", "✨", "👍", "🙌", "💫", "🔥", "😋", "🤤", "❤️", "😍", "🤩", "💯", "🙏"]
  required:
    - "כל טקסט בעברית תקנית"
    - "שעות ומיקום מוזכרים כשרלוונטי"
    - "טענה על מרכיבים תמיד מדויקת - בלי הבטחות שלא נבדקו"

schedule:
  timezone: "Asia/Jerusalem"
  # Closed on Shabbat, so nothing is scheduled for it. The planner moves the
  # week's content onto the days the bakery is actually open.
  skip_days: ["שבת"]
  posts_per_day: 1
  stories_per_day: 1
  post_times:  ["08:00"]
  story_times: ["07:30"]
  approval_lead_days: 2
  mix: { pain: 1, value: 3, identity: 2, social_proof: 0, sell: 1 }

channels:
  instagram: true
  facebook: false

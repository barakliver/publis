# ---------------------------------------------------------------------------
# לחם - מאפים בעבודת יד
#
# Details taken from lehem.co and @lehem.bakery. The palette is a proposal:
# an artisan sourdough bakery needs crust and grain, not the wedding blue.
# Replace it, and drop a logo into assets/, once the real brand files exist.
# ---------------------------------------------------------------------------

id: lehem

brand:
  name: "לחם"
  company: ""
  kind: "מאפייה · קונדיטוריה · בית קפה"
  tagline: "לחמים ומאפים בעבודת יד"
  website: "https://www.lehem.co"
  instagram: "lehem.bakery"
  facebook: ""
  whatsapp: ""
  contact_phone: "03-5335503"
  address: "האתרוג 25, מתחם הולמס פלייס, גבעת שמואל"

product:
  what: >
    לחמי מחמצת, מאפים מתוקים ומלוחים, עוגות ועוגיות, בית קפה ומגשי אירוח.
    קמחים מגרמניה, דגנים מלאים ודבש. בלי חומרים משמרים, בלי משפרי אפייה,
    בלי סוכר בלחמים.
  purpose: "לחם אמיתי בעבודת יד, כל יום, במקום תעשייתי"
  lines:
    breads: ["לבן איטלקי", "כפרי", "שיפון", "בריאות", "קל", "כוסמין", "חיטה מלאה", "רב דגנים"]
    pastry: ["מאפים מתוקים", "מאפים מלוחים", "עוגות", "עוגיות", "בנטו קייק", "ללא סוכר", "טבעוני"]
    cafe:   ["סלטים", "פסטות", "כריכים", "קפה"]
    trays:  ["מגש כריכים", "מגש ירקות", "מגש מתוק", "מגש מלוח"]
  kosher: "כשר בהשגחת רבנות גבעת שמואל"
  hours: "א׳-ה׳ 7:00-19:00 · ו׳ וערבי חג 7:00 עד שעתיים לפני כניסת השבת"
  trays_notice: "מגשי אירוח בהזמנה 48 שעות מראש, באיסוף עצמי"
  years: 11

audience:
  primary: "תושבי גבעת שמואל והסביבה שקונים לחם ומאפים ביומיום"
  secondary: "מזמיני מגשי אירוח - משפחות לאירועים וחברות לישיבות"
  pain: >
    לחם תעשייתי מהסופר נראה זול עד שקוראים מה יש בו.
    ומי שכן רוצה אמיתי לא תמיד יודע איפה זה נאפה ובאיזו שעה.

# ---------------------------------------------------------------------------
# Visual identity. PROPOSED, not supplied - swap for the real palette.
# Crust, sourdough crumb and a warm oven red, so the feed reads as a bakery.
# ---------------------------------------------------------------------------
visual:
  # Measured off the supplied logo artwork, not proposed. The earlier palette
  # here was my invention and is gone - rule 4: where a palette was proposed
  # rather than supplied, replace it, do not defend it.
  colors:
    blue: "#3A322A"        # the dark ground. the logo sits on #242424 charcoal;
                           # warmed slightly toward the chocolate brown asked for
    blue_light: "#8A7656"
    red: "#C09C60"         # wheat gold - the brush outline of the logo
    cream: "#F5EDE2"       # warm off-white, from the wordmark's own #F0E4E4
    white: "#FFFFFF"
    seed: "#90C06C"        # the green seeds. a true accent - tiny, never a ground

  fonts:
    hebrew: "Assistant"
    fallback: "Heebo"

  # This mark is 2.9:1 - tall for its width. At the default 60% it reaches
  # straight up through the engagement marks.
  wordmark_width: "24%"

  assets:
    # Cut from the two supplied PDFs to transparent PNGs. The mono version
    # rides light grounds, the colour one rides dark.
    wordmark_brand: "assets/wordmark-lehem.png"
    wordmark_brand_dark: "assets/wordmark-lehem-dark.png"

  sizes:
    post:  { w: 1080, h: 1350 }
    story: { w: 1080, h: 1920 }

# ---------------------------------------------------------------------------
# Voice. A baker who has been up since four and is not selling you a lifestyle.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Voice. Written as a creative brief, not a list of adjectives - because
# "warm, authentic, artisanal" is the brief every bakery in the country is
# working from, and it is exactly why they all sound the same.
# ---------------------------------------------------------------------------
persona:
  name: "מי שהגיע ב-4"
  who: >
    לא ״המאפייה״ ולא שף. בן אדם אחד שקם מוקדם, יודע מה נכנס לכל בצק,
    ויש לו דעה על לחם תעשייתי. מדבר בגוף ראשון כשזה אישי, ברבים כשזו עבודה.

  stance: >
    לא יוקרה ולא רומנטיקה של קמח. אנחנו לא מוכרים חוויה, אנחנו מוכרים
    את מה שיצא מהתנור הבוקר - וכשהוא נגמר, הוא נגמר.

  # ---- THE LANGUAGE. This is what makes it a brand and not a feed. --------
  # Four devices, used again and again until the audience recognises them
  # before they read the words. That recognition IS the brand.
  devices:
    - id: "clock"
      what: "לכל דבר יש שעה. לא ״טרי״ - ״יצא ב-6:40״."
      why: >
        שעה היא עובדה שאי אפשר לזייף, והיא מה שמאמן אנשים להגיע מוקדם.
        ״טרי״ אומר כל אחד. ״6:40״ אומר רק מי שבאמת היה שם.
    - id: "sold-out"
      what: "פוסט כשנגמר, לא התנצלות. ״הכפרי נגמר ב-10:40. מחר יש עוד.״"
      why: >
        כל עסק מסתיר את זה. לפרסם את זה בונה גם נדירות וגם אמון, ומלמד
        את הקהילה מתי לבוא. זה הפורמט הכי ממיר שיש למאפייה, והוא בחינם.
    - id: "the-hand"
      what: "שורה אחת בכתב יד - הערה, מחיר, משהו שנכתב ברגע."
      why: >
        כתב יד אומר שבן אדם כתב את זה. שורה אחת - לא שבוע שלם, אחרת זה
        הופך לגופן וזה מת.
    - id: "the-position"
      what: "דעה על לחם תעשייתי. חדה, לא מתנצלת, אף פעם לא מתלוננת."
      why: "מאפייה עם דעה אפשר לעקוב אחריה. מאפייה בלי דעה היא חנות."

  # ---- Sharing, the way a person shares, not a brand ---------------------
  personal:
    - "השעה שבה קמים, והמחיר שלה"
    - "האצווה שלא עלתה, ומה עשינו איתה"
    - "לקוח קבוע וההזמנה שלו, בלי שם"
    - "מה אנחנו עצמנו אוכלים כשאף אחד לא מסתכל"

  signature_lines:
    - "יצא ב-6:40"
    - "נגמר. מחר יש עוד."
    - "מחמצת לוקחת יומיים. אין קיצור דרך."
    - "לחם שנשאר רך שבועיים הוא לא לחם. הוא מוצר."

  vocabulary:
    use: ["מחמצת", "בצק", "תפיחה", "אצווה", "קרום", "פירור", "תנור", "קמח"]
    mock: ["משפרי אפייה", "חומרים משמרים", "לחם שנשאר רך שבועיים"]
    # Prefer the time over the word. "טרי" is what everyone says.
    prefer: "שעה מדויקת במקום ״טרי״. מספר במקום שם תואר."

  openers:
    - "יצא ב-"
    - "נגמר."
    - "שאלו אותנו למה"
    - "אני אגיד את זה:"

  pacing: "short. a baker is not writing an essay."

language:
  primary: "he"
  also_supported: ["en"]
  gendering: "dotted"
  address: "plural"
  emoji: "moderate"

rules:
  # Every one of these is a phrase a bakery reaches for when it has nothing
  # specific to say. That is exactly why they are banned: the ban forces the
  # specific thing out. `node test/voice.test.js` enforces this.
  forbidden_words:
    - "נאפה באהבה"
    - "באהבה"
    - "כמו של סבתא"
    - "הסוד שלנו"
    - "חוויה קולינרית"
    - "פינוק"
    - "מפנק"
    - "טעים ברמות"
    - "הכי טעים בעיר"
    - "מוזמנים לטעום"
    - "רק אצלנו"
    - "מסורת של דורות"
    - "קסם"
    - "גורמה"
    - "מושלם"
    - "קסום"
  banned_emoji: ["🚀", "⭐", "✨", "👍", "🙌", "💫", "🔥", "😋", "🤤", "❤️"]
  required:
    - "כל טקסט בעברית תקנית"
    - "שעות ומיקום מוזכרים כשרלוונטי"
    - "טענה על מרכיבים תמיד מדויקת - בלי הבטחות שלא נבדקו"

schedule:
  timezone: "Asia/Jerusalem"
  # Closed on Shabbat, so nothing is scheduled for it. The planner moves the
  # week's content onto the days the bakery is actually open.
  skip_days: ["שבת"]
  posts_per_day: 1
  stories_per_day: 1
  post_times:  ["08:00"]
  story_times: ["07:30"]
  approval_lead_days: 2
  mix: { pain: 1, value: 3, identity: 2, social_proof: 0, sell: 1 }

channels:
  instagram: true
  facebook: false

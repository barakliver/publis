<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Before I Do - render target</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="stage"></div>

<script>
/* ---------------------------------------------------------------------------
   The renderer calls window.render(item) with one content item and then
   screenshots #canvas. Everything below is layout only - no content lives here.
   --------------------------------------------------------------------------- */

/* render.js injects window.BRAND from brand.yaml after the page loads, so
   read it at render time - capturing it here would always see {}. One
   template serves every business; a brand with no logo files gets its name
   set in type instead of a wordmark image. */
const ASSETS = '../assets/';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Hebrew is RTL; numbers, prices, dates and Latin words inside it are LTR.
   Left alone the browser reorders those runs and ships text like "26.10-" or
   "129\u20aa" the wrong way round - the single most common way Hebrew artwork
   goes out broken. Isolating each run in <bdi dir="ltr"> fixes it.

   Punctuation rules, all three learned the hard way and all three tested:
   a LEADING hyphen stays out, or it lands at the wrong end of "\u05d1-26.10";
   a hyphen BETWEEN digits comes in, or a phone number splits into two runs
   and prints reversed; a trailing % comes in, or it flips off "30%".
   The run must start and end on alphanumerics, which is what keeps the first
   rule true while the second one holds. See test/bidi.test.js. */
function bidi(s) {
  return esc(s).replace(/[A-Za-z0-9](?:[A-Za-z0-9.,:\/%-]*[A-Za-z0-9%])?/g,
    (m) => '<bdi dir="ltr">' + m + '</bdi>');
}

/* Type scale. The image carries one idea, so it is set to be read at a
   thumb's distance while scrolling - a short line fills most of the width and
   a long one still lands well above body size. Shorter lines get bigger, not
   looser. The curve falls off gently: nothing here is long enough to justify
   small type, and the dots coming off the bottom gave the block more room. */
/* Keep a piece of furniture in proportion to the headline without letting a
   very short hook inflate it. */
function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

function autoSize(text, base) {
  const n = String(text || '').length;
  if (n <= 18)  return base * 1.34;
  if (n <= 30)  return base * 1.18;
  if (n <= 45)  return base;
  if (n <= 62)  return base * 0.90;
  if (n <= 85)  return base * 0.80;
  if (n <= 115) return base * 0.71;
  return base * 0.63;
}


/* Instagram's engagement marks, drawn inline so nothing has to load. */
const SOCIAL = `<div class="social">
  <span class="like"><svg viewBox="0 0 24 24"><path d="M12 20.7 3.9 12.6a5 5 0 1 1 7.1-7.1l1 1 1-1a5 5 0 1 1 7.1 7.1z"/></svg></span>
  <span class="comment"><svg viewBox="0 0 24 24"><path d="M21 11.6a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-2.9-.5L3.2 21l1.6-4.8A8.3 8.3 0 0 1 3 11.6a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4z"/></svg></span>
  <span class="send"><svg viewBox="0 0 24 24"><path d="M21.5 2.5 10.8 13.2"/><path d="M21.5 2.5 14.7 21.6l-3.9-8.4-8.4-3.9z"/></svg></span>
  <span class="save"><svg viewBox="0 0 24 24"><path d="M19 21.2 12 16.2 5 21.2V4.4a1.9 1.9 0 0 1 1.9-1.9h10.2A1.9 1.9 0 0 1 19 4.4z"/></svg></span>
</div>`;

window.render = function (item, pos) {
  /* `pos` describes where this slide sits in its carousel:
     {index, total}. A single-image post passes total <= 1. */
  const BRAND = window.BRAND || {};
  const idx   = pos ? pos.index : 0;
  const total = pos ? pos.total : 1;
  const isCarousel = total > 1;
  const isStory = item.format === 'story';
  const W = 1080;
  const H = isStory ? 1920 : 1350;
  const layout = item.layout || 'statement';

  const headSize = autoSize(item.headline, isStory ? 118 : 124);
  const subSize  = Math.max(46, headSize * 0.47);

  const parts = [];

  /* Photo layer. Content names a photo ("couple-cafe"); the library folder
     and the right crop for this format are resolved here. */
  if (layout === 'photo' && item.photo) {
    const photoSrc = item.photo.includes('/')
      ? item.photo
      : `../assets/photos/${isStory ? 'story' : 'post'}/${item.photo}.jpg`;
    parts.push(`<img class="photo" src="${esc(photoSrc)}">`);
    parts.push(`<div class="scrim"></div>`);
  }

  /* Frame - the cards' signature rounded outline */
  if (layout === 'dilemma' || layout === 'dark') {
    parts.push(`<div class="frame"></div>`);
  }

  /* The brand mark, top centre. Not every brand has one. */
  if (BRAND.mark) parts.push(`<img class="heart" src="${esc(BRAND.mark)}">`);

  /* Optional price badge */
  if (item.badge) {
    parts.push(
      `<div class="badge" style="font-size:${clamp(headSize * 0.34, 36, 52)}px">${bidi(item.badge)}</div>`
    );
  }

  /* Body */
  const body = [];
  if (item.dilemma) {
    const optSize = autoSize(item.dilemma.join(' '), isStory ? 110 : 114);
    body.push(`<div class="dilemma">
      <div class="option" style="font-size:${optSize}px">${bidi(item.dilemma[0])}</div>
      <div class="or" style="font-size:${optSize * 1.02}px">או</div>
      <div class="option" style="font-size:${optSize}px">${bidi(item.dilemma[1])}</div>
    </div>`);
  } else {
    if (item.headline) {
      body.push(`<div class="headline" style="font-size:${headSize}px">${bidi(item.headline)}</div>`);
    }
    if (item.subline) {
      body.push(`<div class="subline" style="font-size:${subSize}px">${bidi(item.subline)}</div>`);
    }
  }
  parts.push(`<div class="content">${body.join('')}</div>`);

  /* Call to action */
  if (item.cta) {
    if (isStory) {
      parts.push(`<div class="story-cta" style="font-size:${clamp(headSize * 0.36, 40, 56)}px">
        ${bidi(item.cta)}<span class="arrow"></span>
      </div>`);
    } else {
      const ghost = (layout === 'statement' || layout === 'dilemma') ? ' ghost' : '';
      parts.push(`<div class="cta${ghost}" style="font-size:${clamp(headSize * 0.34, 38, 52)}px">${bidi(item.cta)}</div>`);
    }
  }

  /* Engagement marks, on the LAST slide only - that is the slide doing the
     asking. Drawn on all of them they stopped reading as a prompt. A single
     image and a story are their own last slide, so they keep them. */
  const isLast = idx === total - 1;
  if (isLast) parts.push(SOCIAL);

  /* Carousel furniture: a swipe hint on the first slide. No progress dots -
     Instagram draws its own indicator over the image, and a second row
     underneath it read as a mistake. */
  if (isCarousel && idx === 0) {
    parts.push(`<div class="swipe" style="font-size:${clamp(headSize * 0.29, 34, 44)}px">
      <span>החליקו</span><span class="chev"></span>
    </div>`);
  }

  /* Wordmark, bottom centre. An image where the brand has one, otherwise
     its name set in type - a new brand is legible before it has artwork. */
  const onDark = (layout === 'dark' || layout === 'photo');
  const wm = BRAND.wordmarks || {};
  // The card layouts are signed by the company, the open ones by the brand -
  // the way the printed deck does it.
  const co = wm.company || {};
  const useCompany = (layout === 'dilemma' || layout === 'dark') && (co.light || co.dark);
  const set = useCompany ? co : wm;
  const file = onDark ? (set.dark || set.light) : (set.light || set.dark);
  if (file) {
    parts.push(`<img class="wordmark" src="${esc(file)}">`);
  } else if (BRAND.name) {
    parts.push(`<div class="wordmark-text" style="font-size:${clamp(headSize * 0.30, 30, 46)}px">${esc(BRAND.name)}</div>`);
  }

  document.getElementById('stage').innerHTML =
    `<div class="canvas${isLast ? ' has-social' : ''}${BRAND.mark ? '' : ' no-mark'}" id="canvas" data-layout="${esc(layout)}"
          style="width:${W}px;height:${H}px;
                 --blue:${esc(BRAND.colors?.blue || '#4E6BA5')};
                 --blue-light:${esc(BRAND.colors?.blue_light || '#7F9ACE')};
                 --red:${esc(BRAND.colors?.red || '#F64C3B')};
                 --cream:${esc(BRAND.colors?.cream || '#FFF9F3')};
                 --gap-top:${isStory ? 112 : 118}px;
                 --gap-bottom:${isStory ? 372 : 378}px;
                 --frame-top:${isStory ? '5.4%' : '7.0%'};
                 --frame-bottom:${isStory ? '5.6%' : '7.2%'};
                 --heart-top:${isStory ? '3.2%' : '4.1%'};
                 --wordmark-bottom:${isStory ? '2.8%' : '3.4%'};
                 --badge-top:${isStory ? '11.5%' : '14.5%'};
                 --content-shift:${isStory ? '-9%' : '-6%'};
                 --social-bottom:${isStory ? '9.4%' : '12.2%'};
                 --social-size:${isStory ? '40px' : '46px'};
                 --social-gap:${isStory ? '30px' : '34px'};
                 --swipe-bottom:${isStory ? '11.0%' : '13.2%'};
                 --cta-bottom-social:${isStory ? '13.0%' : '19.0%'}">
       ${parts.join('')}
     </div>`;

  return { w: W, h: H };
};
</script>
</body>
</html>

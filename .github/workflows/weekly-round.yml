name: Weekly round

# Saturday evening: build next week's round and push it, so the team opens
# Sunday to a round that is already waiting.
#
# 15:00 UTC is 18:00 in Israel through the summer and 17:00 once the clocks
# go back. Cron has no timezone, so the hour shifts by one across the year -
# which does not matter for a round nobody reads until the next morning.
on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to build, e.g. 2026-W41. Blank means next week.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --omit=optional || npm install
          npx playwright install --with-deps chromium

      - name: Work out which week to build
        id: week
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            echo "week=${{ inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            # Built on Saturday for the week starting the day after tomorrow.
            echo "week=$(date -u -d 'next monday' +%G-W%V)" >> "$GITHUB_OUTPUT"
          fi

      # Every brand folder is built. Adding a business stays a folder, not a
      # workflow edit. One brand failing must not take the others down, so
      # each is wrapped and the failures are reported at the end.
      - name: Build every business
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          WEEK="${{ steps.week.outputs.week }}"
          node test/bidi.test.js
          FAILED=""

          for DIR in brands/*/; do
            B=$(basename "$DIR")
            [ -f "$DIR/brand.yaml" ] || continue
            echo "::group::$B"

            CONTENT="$DIR/content/$WEEK.js"
            if [ ! -f "$CONTENT" ]; then
              if ! node core/write.js "$B" "$WEEK"; then
                LATEST=$(ls "$DIR"content/*.js 2>/dev/null | sort | tail -1)
                if [ -n "$LATEST" ]; then
                  echo "::warning::$B - no generated content, reusing $(basename "$LATEST")."
                  sed "s/week: *'[^']*'/week: '$WEEK'/; s/\"week\": *\"[^\"]*\"/\"week\": \"$WEEK\"/" \
                    "$LATEST" > "$CONTENT"
                else
                  echo "::warning::$B - no content at all, skipping."
                  echo "::endgroup::"
                  continue
                fi
              fi
            fi

            if node core/plan.js   "$B" "$WEEK" \
            && node core/render.js "$B" "rounds/$B/$WEEK" \
            && node core/review.js "$B" "rounds/$B/$WEEK"; then
              echo "$B ok"
            else
              echo "::error::$B failed to build"
              FAILED="$FAILED $B"
            fi
            echo "::endgroup::"
          done

          node core/hub.js
          [ -z "$FAILED" ] || { echo "failed:$FAILED"; exit 1; }

      - name: Commit
        if: always()
        run: |
          WEEK="${{ steps.week.outputs.week }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Weekly round $WEEK

          Built by the Monday job: content, images, approval page and the
          hand-off download. Nothing is scheduled or published - the round
          waits for approval."
            git push
          fi
